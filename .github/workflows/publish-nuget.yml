name: Publish C# NuGet and GPR

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-nuget.yml'
      - 'src/Bannerlord.LauncherManager/**.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - run: dotnet pack -c Release src/Bannerlord.LauncherManager.Localization -p:VersionOverride=$(git rev-list --no-merges --count master) -o ./packages

      - run: dotnet pack -c Release src/Bannerlord.LauncherManager.Models -p:VersionOverride=$(git rev-list --no-merges --count master) -o ./packages

      - run: dotnet pack -c Release src/Bannerlord.LauncherManager -p:VersionOverride=$(git rev-list --no-merges --count master) -o ./packages

      # The packages and their symbol packages travel to the signing and the push
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./packages/
          if-no-files-found: error

  # Signs the Bannerlord.LauncherManager*.dll inside the packages with the Certum certificate, and adds
  # package-signed copies in package-signed/ for GPR
  sign:
    needs: [pack]
    uses: BUTR/workflows/.github/workflows/sign-certum.yml@master
    with:
      artifact_name: nuget
    secrets:
      CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
      CODE_SIGNING_PRIVATE_KEY: ${{ secrets.CODE_SIGNING_PRIVATE_KEY }}

  # Pushed from this workflow, so the nuget.org trusted publishing policy for publish-nuget.yml still applies
  publish:
    name: Publish on NuGet and GPR
    needs: [sign]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Download the signed packages
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ./packages

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Aragas

      # nuget.org only accepts a package signature from a certificate registered there, it gets the packages with
      # the signed binaries but without one
      - name: Push to NuGet
        run: dotnet nuget push "./packages/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GPR
        run: dotnet nuget push "./packages/package-signed/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/BUTR/index.json --skip-duplicate
